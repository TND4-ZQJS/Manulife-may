<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAY Guide Navigator</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f7f6;--sf:#fff;--tx:#17302a;--mu:#5d7068;--ac:#00854a;--ln:#d9e2de;--hl:#fff3a8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a17;--sf:#1b2622;--tx:#e6efeb;--mu:#93a69d;--ac:#3ecf8e;--ln:#2d3b35;--hl:#5c5200}}
:root[data-theme="dark"]{--bg:#121a17;--sf:#1b2622;--tx:#e6efeb;--mu:#93a69d;--ac:#3ecf8e;--ln:#2d3b35;--hl:#5c5200}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sf);border-bottom:1px solid var(--ln);padding:8px 10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#q{flex:1;min-width:140px}
h1{font-size:15px;margin:0 0 6px}
#panel{background:var(--sf);border-bottom:1px solid var(--ln);max-height:55vh;overflow:auto;display:none}
#panel.show{display:block}
.it{padding:9px 12px;border-bottom:1px solid var(--ln);cursor:pointer}
.it:hover{background:var(--bg)}.it small{color:var(--mu)}mark{background:var(--hl);color:inherit}
.l1{padding-left:26px}.l2{padding-left:40px}.pg{float:right;color:var(--mu);margin-left:8px}
#view{padding:8px;text-align:center}
canvas{max-width:100%;background:#fff;box-shadow:0 1px 6px #0003}
#msg{color:var(--mu);padding:6px 12px;font-size:13px}
#panel .row{padding:8px 10px}.nav{position:sticky;bottom:0;background:var(--sf);border-top:1px solid var(--ln);padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));justify-content:center}
#pn{width:64px;text-align:center}
</style></head><body>
<header>
<h1>Manulife Assist You (MAY)</h1>
<div class="row"><button id="bT">☰ Contents</button>
<span id="pb" class="row"></span><button id="bQ">❓ All questions</button></div>
<div class="row" style="margin-top:6px"><input id="q" type="search" placeholder="Search the guide, e.g. policy loan" autocomplete="off"><select id="sc" style="font:inherit;padding:7px;border-radius:8px;background:var(--bg);color:var(--tx);border:1px solid var(--ln)"><option value="">All parts</option></select></div>
</header>
<div id="panel"></div><div id="msg">Loading guide…</div>
<div id="view"><canvas id="cv"></canvas></div>
<div class="row nav"><button id="pv">‹ Prev</button><input id="pn" type="number" min="1"><span id="tot"></span><button id="nx">Next ›</button><button id="sh">Copy link</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
let QS=[],PARTS=[],PN={};
const $=id=>document.getElementById(id);
let pdf,cur=1,N=0,texts=[],ready=false,outline=[],tok=0;
const partOf=p=>(PARTS.find(x=>p>=x[0]&&p<=x[1])||[0,0,''])[2];
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
function setHash(){try{history.replaceState(null,"","#p"+cur)}catch(e){}}
async function show(p){
  p=Math.max(1,Math.min(N,p));cur=p;$("pn").value=p;setHash();const t=++tok;
  const pg=await pdf.getPage(p);if(t!==tok)return;
  const w=Math.min(document.body.clientWidth-16,900),v0=pg.getViewport({scale:1}),dpr=window.devicePixelRatio||1;
  const vp=pg.getViewport({scale:w/v0.width*dpr}),c=$("cv");
  c.width=vp.width;c.height=vp.height;c.style.width=w+"px";
  await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
  window.scrollTo(0,0);document.querySelectorAll("[data-a]").forEach(b=>b.classList.toggle("on",b.dataset.a===partOf(p)));
}
function panel(html){const e=$("panel");e.innerHTML=html;e.classList.add("show")}
function closePanel(){$("panel").classList.remove("show")}
function go(p){closePanel();show(p)}
function toc(){
  panel(outline.map(o=>`<div class="it l${o.l}" data-go="${o.p}"><span class="pg">p.${o.p}</span>${o.r?`<small>${o.r}</small> `:""}${o.t}</div>`).join(""));
}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function search(){
  const q=$("q").value.trim().toLowerCase();if(q.length<2){closePanel();return}
  if(!ready){panel('<div class="it">Still reading the pages — try again in a moment.</div>');return}
  const sc=$("sc").value,words=q.split(/\s+/),out=[];
  for(let i=0;i<N;i++){
    if(sc&&partOf(i+1)!==sc)continue;const t=texts[i],lt=t.toLowerCase();
    if(!words.every(w=>lt.includes(w)))continue;
    const at=lt.indexOf(q)>=0?lt.indexOf(q):lt.indexOf(words[0]);
    let s=esc(t.slice(Math.max(0,at-60),at+110));
    words.forEach(w=>{s=s.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/&/g,"&amp;"),"gi"),m=>"<mark>"+m+"</mark>")});
    out.push({p:i+1,s,exact:lt.includes(q)?0:1});
  }
  out.sort((a,b)=>a.exact-b.exact||a.p-b.p);
  panel(out.length?`<div class="it"><small>${out.length} page(s) match${out.length>60?" — showing first 60":""}</small></div>`+out.slice(0,60).map(r=>`<div class="it" data-go="${r.p}"><span class="pg">p.${r.p}</span>…${r.s}…</div>`).join(""):'<div class="it">No matches. Try fewer or different words.</div>');
}
async function loadOutline(){
  try{const o=await pdf.getOutline();if(!o||!o.length)return;const flat=[];
    async function walk(a,l){for(const x of a){let p=null;try{let d=x.dest;if(typeof d==="string")d=await pdf.getDestination(d);if(d)p=await pdf.getPageIndex(d[0])+1}catch(e){}
      if(p)flat.push({l:Math.min(l,2),r:"",t:esc(x.title),p});if(x.items&&x.items.length)await walk(x.items,l+1)}}
    await walk(o,0);if(flat.length)outline=flat}catch(e){}
}
async function init(){
  try{
    const D=await (await fetch("data.json?v="+Date.now())).json();
    QS=D.questions;PARTS=D.parts.map(p=>[p.start,p.end,p.key]);D.parts.forEach(p=>PN[p.key]=p.name);qPart=D.parts[D.parts.length-1].key;
    D.parts.forEach(p=>{outline.push({l:0,r:"",t:"<b>PART "+p.key+" — "+p.name.toUpperCase()+"</b>",p:p.start});D.outline.filter(o=>o.p>=p.start&&o.p<=p.end).forEach(o=>outline.push({l:o.l,r:o.r,t:esc(o.t),p:o.p}))});
    $("pb").innerHTML=D.parts.map(p=>`<button data-p="${p.start}" data-a="${p.key}">${esc(p.name)}</button>`).join("");
    $("sc").innerHTML+=D.parts.map(p=>`<option value="${p.key}">${esc(p.name)}</option>`).join("");
    document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>go(+b.dataset.p));
    pdf=await pdfjsLib.getDocument({url:"guide.pdf"}).promise;N=pdf.numPages;$("tot").textContent="/ "+N;$("pn").max=N;
    await loadOutline();
    const h=parseInt((location.hash.match(/^#p(\d+)$/)||[])[1]);await show(h||1);$("msg").textContent="Reading pages for search… 0%";
    for(let i=1;i<=N;i++){const pg=await pdf.getPage(i),tc=await pg.getTextContent();texts.push(tc.items.map(x=>x.str).join(" ").replace(/\s+/g," "));
      if(i%20===0)$("msg").textContent="Reading pages for search… "+Math.round(i/N*100)+"%"}
    ready=true;$("msg").textContent="Search ready. Tap Contents or type a keyword.";if($("q").value)search();
  }catch(e){$("msg").textContent="Could not load the guide: "+e.message}
}
$("q").addEventListener("input",search);$("sc").addEventListener("change",search);
$("bT").onclick=()=>$("panel").classList.contains("show")?closePanel():toc();
$("panel").addEventListener("click",e=>{const t=e.target.closest("[data-go]");if(t)go(+t.dataset.go)});
$("pv").onclick=()=>show(cur-1);$("nx").onclick=()=>show(cur+1);
$("pn").addEventListener("change",()=>show(+$("pn").value||1));
$("sh").onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$("sh").textContent="Copied ✓";setTimeout(()=>$("sh").textContent="Copy link",1500)}catch(e){prompt("Copy this link",location.href)}};
addEventListener("hashchange",()=>{const h=parseInt((location.hash.match(/^#p(\d+)$/)||[])[1]);if(h&&h!==cur)show(h)});
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight")show(cur+1);if(e.key==="ArrowLeft")show(cur-1)});
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>pdf&&show(cur),250)});

let qPart="",qF="";
function qHtml(){
  const f=qF.toLowerCase().split(/\s+/).filter(Boolean);let last="",n=0,o="";
  for(const q of QS){
    if(partOf(q.p)!==qPart)continue;const t=(q.q+" "+q.st).toLowerCase();
    if(!f.every(w=>t.includes(w)))continue;n++;
    if(q.s!==last){last=q.s;o+=`<div class="it" style="background:var(--bg);font-weight:600" data-go="${q.p}">${q.s} ${esc(q.st)}</div>`}
    o+=`<div class="it" data-go="${q.p}"><span class="pg">p.${q.p}</span><small>Q${q.n}</small> ${esc(q.q)}</div>`;
  }
  return `<div class="it"><small>${n} question(s)</small></div>`+o;
}
function questions(){
  const c=(k,l)=>`<button data-qp="${k}" class="${qPart===k?"on":""}">${esc(l)}</button>`;
  panel(`<div class="it row" style="position:sticky;top:0;background:var(--sf);z-index:2;cursor:default">${PARTS.map(p=>c(p[2],PN[p[2]])).join("")}<input id="qf" type="search" placeholder="Filter questions…" value="${esc(qF)}" style="flex:1;min-width:120px"></div><div id="ql">${qHtml()}</div>`);
  $("qf").oninput=e=>{qF=e.target.value;$("ql").innerHTML=qHtml()};
}
$("bQ").onclick=()=>questions();
$("panel").addEventListener("click",e=>{const b=e.target.closest("[data-qp]");if(b){qPart=b.dataset.qp;questions()}});
init();
</script></body></html>
